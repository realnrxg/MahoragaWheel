plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.0.2'
group = 'dev.adaptation'

loom { accessWidenerPath = file("src/main/resources/mahoraga_wheel.accesswidener") }

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.2+26.3'
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }

tasks.withType(Jar).configureEach { from('LICENSE') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('meshCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.adaptation.WheelMeshCheck'
    enableAssertions = true
}
check.dependsOn meshCheck
// The dependency-free mesh checks run through JavaExec rather than JUnit.
test { failOnNoDiscoveredTests = false }
